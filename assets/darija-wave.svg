<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">DerjaSpeechLab</title>
  <desc id="desc">Animated audio waveform in Tunisian red with Arabic and Latin project titles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#130b2b"/>
      <stop offset="0.52" stop-color="#24134d"/>
      <stop offset="1" stop-color="#46142f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.5" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect width="1200" height="260" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle cx="1080" cy="-10" r="250" fill="#e70013" opacity=".10"/>
    <circle cx="90" cy="280" r="210" fill="#7c3aed" opacity=".14"/>

    <g opacity=".14" stroke="#ffffff">
      <path d="M0 52H1200M0 104H1200M0 156H1200M0 208H1200"/>
      <path d="M100 0V260M300 0V260M500 0V260M700 0V260M900 0V260M1100 0V260"/>
    </g>

    <text x="600" y="62" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2">DERJASPEECHLAB</text>
    <text x="600" y="96" text-anchor="middle" fill="#fda4af" font-size="20" font-family="Segoe UI, Arial, sans-serif">الصوت التونسي  ·  RECOGNIZE  ·  UNDERSTAND  ·  TRANSLATE</text>

    <g transform="translate(95 166)" fill="url(#wave)" filter="url(#glow)">
      <rect x="0" y="-6" width="9" height="12" rx="4"><animate attributeName="height" values="12;28;12" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-6;-14;-6" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="24" y="-15" width="9" height="30" rx="4"><animate attributeName="height" values="30;62;30" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-31;-15" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="48" y="-28" width="9" height="56" rx="4"><animate attributeName="height" values="56;30;56" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-28;-15;-28" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="72" y="-42" width="9" height="84" rx="4"><animate attributeName="height" values="84;44;84" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="-42;-22;-42" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="96" y="-19" width="9" height="38" rx="4"><animate attributeName="height" values="38;76;38" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-19;-38;-19" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="120" y="-9" width="9" height="18" rx="4"><animate attributeName="height" values="18;42;18" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="-9;-21;-9" dur=".8s" repeatCount="indefinite"/></rect>
      <path d="M150 0H850" stroke="url(#wave)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".9"/>
      <rect x="870" y="-12" width="9" height="24" rx="4"><animate attributeName="height" values="24;58;24" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="-12;-29;-12" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="894" y="-33" width="9" height="66" rx="4"><animate attributeName="height" values="66;34;66" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="-33;-17;-33" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="918" y="-20" width="9" height="40" rx="4"><animate attributeName="height" values="40;82;40" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-20;-41;-20" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="942" y="-11" width="9" height="22" rx="4"><animate attributeName="height" values="22;48;22" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-11;-24;-11" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="966" y="-5" width="9" height="10" rx="4"><animate attributeName="height" values="10;26;10" dur=".8s" repeatCount="indefinite"/><animate attributeName="y" values="-5;-13;-5" dur=".8s" repeatCount="indefinite"/></rect>
    </g>

    <text x="600" y="230" text-anchor="middle" fill="#c4b5fd" font-size="15" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1">TUNISIAN ARABIC ASR &amp; SPEECH TRANSLATION</text>
  </g>
</svg>
